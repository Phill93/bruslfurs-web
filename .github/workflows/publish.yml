name: Build and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/overlays/production/kustomization.yaml"
      - "deploy/overlays/staging/kustomization.yaml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: production-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://brusler-furs.de' }}
      - name: Containerdaten festlegen
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: SITE_URL=${{ vars.SITE_URL || 'https://brusler-furs.de' }}
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.7.1"
      - name: Production-Image aktualisieren
        working-directory: deploy/overlays/production
        run: kustomize edit set image buslfurs-web=${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
      - name: Staging-Image aktualisieren
        working-directory: deploy/overlays/staging
        run: kustomize edit set image buslfurs-web=${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
      - name: GitOps-Änderung veröffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/production/kustomization.yaml deploy/overlays/staging/kustomization.yaml
          git commit -m "chore(deploy): update production image [skip ci]"
          git push
