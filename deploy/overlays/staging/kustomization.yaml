apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: staging-
resources:
  - ../../base
  - middleware.yaml
labels:
  - pairs:
      app.kubernetes.io/instance: staging
    includeSelectors: true
images:
  - name: buslfurs-web
    newName: ghcr.io/OWNER/REPOSITORY
    newTag: initial
patches:
  - target:
      kind: Deployment
      name: buslfurs-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: buslfurs-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.brusler-furs.de
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: buslfurs-staging-buslfurs-basic-auth@kubernetescrd,buslfurs-staging-buslfurs-noindex@kubernetescrd
