apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: staging-
resources:
- ../../base
- middleware.yaml
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: staging
images:
- name: buslfurs-web
  newName: ghcr.io/phill93/bruslfurs-web
  newTag: 41b3e5c9155c-11
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: buslfurs-web
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: staging.brusler-furs.de
    - op: add
      path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
      value: bruslfurs-staging-buslfurs-noindex@kubernetescrd
  target:
    kind: Ingress
    name: buslfurs-web
