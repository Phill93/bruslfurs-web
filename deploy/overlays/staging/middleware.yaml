apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: buslfurs-basic-auth
spec:
  basicAuth:
    secret: staging-buslfurs-basic-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: buslfurs-noindex
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow, noarchive"
